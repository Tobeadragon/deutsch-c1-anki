<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Anki Meister</title>
    <link rel="icon" href="image/favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./styles/style.css">
    <style>
        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            padding: 20px;
            writing-mode: horizontal-tb;
        }

        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary, #007aff);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-passkey {
            width: 100%;
            padding: 14px;
            background: #000;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .divider {
            margin: 20px 0;
            color: #ccc;
            font-size: 0.8rem;
        }

        .login-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <h1 style="color: var(--primary); margin-bottom: 20px;">Anki Meister</h1>

        <div class="login-card">
            <h2>Willkommen</h2>
            <p style="color:#666; font-size:0.9rem; margin-bottom:20px;">進捗を同期するにはログインしてください</p>

            <button id="passkey-btn" class="btn-passkey">🔑 パスキーでログイン</button>

            <div class="divider">またはメールアドレス</div>

            <input type="email" id="email" class="login-input" placeholder="E-Mail Addresse">
            <button id="magic-link-btn" class="btn-primary">ログインリンク送信</button>

            <p id="msg" style="margin-top: 20px; color: var(--primary); font-weight: bold; min-height: 1.2em;"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./scripts/config.js"></script>

    <script>
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. マジックリンク送信（新規ユーザーもここから）
        document.getElementById('magic-link-btn').onclick = async () => {
            const email = document.getElementById('email').value;
            if (!email) return alert("Emailを入力してください");

            const redirectUrl = window.location.href.replace('login.html', 'index.html');

            const { error } = await supabaseClient.auth.signInWithOtp({
                email,
                options: { emailRedirectTo: redirectUrl }
            });

            if (error) alert(error.message);
            else document.getElementById('msg').innerText = "📩 メールを送信しました。";
        };

        // 2. パキーログイン (メールアドレス入力後に実行)
        document.getElementById('passkey-btn').onclick = async () => {
            const email = document.getElementById('email').value;
            if (!email) {
                alert("パスキーを使用するには、まずメールアドレスを入力してください。");
                return;
            }

            const { error } = await supabaseClient.auth.signInWithPasskey({ email });

            if (error) {
                alert("パスキーが見つからないか、エラーが発生しました。\n初回はメールリンクでログインし、設定から登録を行ってください。");
            } else {
                window.location.href = 'index.html';
            }
        };
    </script>
</body>

</html>
